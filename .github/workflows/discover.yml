name: Auto Pilot inventory URL discovery

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Dealerships to inspect this run (1-250)'
        required: false
        default: '100'

permissions:
  contents: write

concurrency:
  group: autopilot-dealer-inventory-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - name: Research dealership URLs
        run: python src/repo_worker.py --batch-size "$BATCH_SIZE" --workers 6
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '100' }}
      - name: Save research results to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m 'Update dealership inventory URL discoveries'
            git push
          else
            echo 'No new research results to save.'
          fi
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-report-${{ github.run_number }}
          path: results/progress.json
          if-no-files-found: ignore
          retention-days: 30
