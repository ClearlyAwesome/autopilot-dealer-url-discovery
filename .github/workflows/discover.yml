name: Auto Pilot inventory URL discovery

on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Dealerships to inspect this run (1-250)'
        required: false
        default: '250'
      batch_count:
        description: 'Sequential batches per run (1-8)'
        required: false
        default: '8'

permissions:
  contents: write

concurrency:
  group: autopilot-dealer-inventory-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - name: Research and checkpoint dealership batches
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '250' }}
          BATCH_COUNT: ${{ github.event.inputs.batch_count || '8' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [[ "$BATCH_COUNT" =~ ^([1-8])$ ]] || { echo 'Batch count must be 1-8'; exit 1; }
          [[ "$BATCH_SIZE" =~ ^[0-9]{1,3}$ ]] && (( 10#$BATCH_SIZE >= 1 && 10#$BATCH_SIZE <= 250 )) || { echo 'Batch size must be 1-250'; exit 1; }
          started=$SECONDS
          for ((i=1; i<=BATCH_COUNT; i++)); do
            remaining=$((2700 - (SECONDS - started)))
            if (( remaining < 300 )); then
              echo 'Stopping before job timeout; completed batches already saved.'
              break
            fi
            echo "Batch $i of $BATCH_COUNT"
            timeout --kill-after=15s "${remaining}s" python src/repo_worker.py --batch-size "$BATCH_SIZE" --workers 10
            git add results/
            if ! git diff --cached --quiet; then
              git commit -m "Update dealership inventory URL discoveries (batch $i)"
              git push
            fi
            if python -c 'import json,sys; sys.exit(0 if json.load(open("results/progress.json"))["remaining_to_research"] == 0 else 1)'; then
              echo 'No currently eligible dealerships remain.'
              break
            fi
          done
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-report-${{ github.run_number }}
          path: results/progress.json
          if-no-files-found: ignore
          retention-days: 30
