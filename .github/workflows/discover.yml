name: Auto Pilot inventory URL discovery

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Dealerships to inspect this run (1-250)'
        required: false
        default: '100'

permissions:
  contents: read

concurrency:
  group: autopilot-dealer-inventory-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - name: Discover URLs and update Google Sheet
        if: ${{ env.HAS_SHEETS_CREDENTIALS == 'true' }}
        run: python src/discover.py --batch-size "$BATCH_SIZE" --workers 8 --report run-report.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: 1tGBSFp-bxhW1_uocOU0uBinXtPos-TKPJLyNDmrNrX0
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '100' }}
      - name: Explain missing credential
        if: ${{ env.HAS_SHEETS_CREDENTIALS != 'true' }}
        run: echo 'Google Sheets service account is not configured. Add GOOGLE_SERVICE_ACCOUNT_JSON and share the Sheet with that account.'
      - name: Upload non-secret run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-report-${{ github.run_number }}
          path: run-report.json
          if-no-files-found: ignore
          retention-days: 30
